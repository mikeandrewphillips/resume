# Master CV - the COMPLETE record. Never trim this file.
# Reconciled from LinkedIn (2026-05).
#
# Tagging model
# -------------
# Every resume builds from this one file; variants/*.yaml pick what shows.
#
#   * Untagged string / group with no `tags:`  -> CORE: on every resume
#     (contact, education EI+Auburn, compact certs, core tech).
#   * Experience bullets are tagged for the ONE-PAGER audience(s) they
#     belong to: `overview` (the standard, management-forward career
#     resume), `networking`, `product`. The current Grainger EM lead
#     bullet carries all three so every one-pager leads with the job.
#   * Bullets meant only for the complete CV carry lifecycle tags
#     (`extended` present-day depth, `early`, `research`, `teaching`,
#     `academic`, `detail`) and NO one-pager tag, so the one-pagers skip
#     them while `full` (no tag filter) keeps everything.
#
# Variants: standard=[overview] product=[product] networking=[networking]
#           full=everything, rendered with the classic multi-page CV.

